<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NUIST 电费仪表盘</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="header">
        <h1>⚡ NUIST 电费仪表盘</h1>
        <span id="refresh-badge" class="badge">实时推送 (SSE)</span>
      </header>

      <div id="loading" class="loading">加载中...</div>
      <div id="error" class="error hidden"></div>
      <div id="empty" class="empty hidden">
        <div class="empty-icon">📭</div>
        <p>暂无绑定账号</p>
        <p class="empty-hint">通过聊天命令 /power bind 绑定账号，或在插件配置中通过 WebUI 添加</p>
      </div>

      <div id="content" class="hidden">
        <div id="summary-cards" class="summary-cards"></div>

        <section class="chart-section">
          <div class="chart-header">
            <h2>📈 余额历史趋势</h2>
            <div class="group-toggle">
              <button class="group-btn active" data-group="raw">原始</button>
              <button class="group-btn" data-group="day">按天</button>
              <button class="group-btn" data-group="month">按月</button>
            </div>
          </div>
          <select id="account-selector" class="account-selector"></select>
          <div class="chart-container">
            <canvas id="chart"></canvas>
          </div>
          <div id="chart-empty" class="chart-empty hidden">暂无历史数据</div>
        </section>

        <section class="table-section">
          <h2>📋 全部账号</h2>
          <div class="table-wrap">
            <table id="account-table">
              <thead>
                <tr>
                  <th>学号</th><th>校区</th><th>楼栋</th><th>房号</th>
                  <th>Token</th><th>订阅</th><th>最近余额</th>
                </tr>
              </thead>
              <tbody id="account-tbody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
